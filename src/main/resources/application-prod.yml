spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db}:3306/signalPulse
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never
  mail:
    host: smtp.gmail.com
    port: 587

application:
  security:
    jwt:
      # Require JWT_SECRET to be set explicitly in prod — fail-fast if missing
      secret-key: ${JWT_SECRET}

logging:
  level:
    com.signalpulse: WARN
    org.springframework.web: ERROR
