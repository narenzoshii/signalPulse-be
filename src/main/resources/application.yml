server:
  port: 9090
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: signal-pulse
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test} # Default to test profile
  sql:
    init:
      mode: always
      data-locations: ${SQL_INIT_DATA_LOCATIONS:classpath:dataInitialize.sql}
  jpa:
    defer-datasource-initialization: true

# Monitoring and Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    java:
      enabled: true
    os:
      enabled: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours
