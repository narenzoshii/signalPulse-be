server:
  port: 9090
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: signal-pulse
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test} # Local default; override in deploy environments
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      data-locations: ${SQL_INIT_DATA_LOCATIONS:classpath:dataInitialize.sql}
  jpa:
    defer-datasource-initialization: true
    open-in-view: false

# Monitoring and Management
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    java:
      enabled: true
    os:
      enabled: true

application:
  security:
    jwt:
      # Dev fallback only — prod/uat profiles override and require JWT_SECRET via env
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours

app:
  scan:
    pool-size: ${SCAN_POOL_SIZE:8}             # bounded executor for outbound feed/page I/O
    task-timeout-seconds: ${SCAN_TASK_TIMEOUT:120}

spring.mail:
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.starttls.required: true
    mail.smtp.connectiontimeout: 5000
    mail.smtp.timeout: 10000
    mail.smtp.writetimeout: 10000
