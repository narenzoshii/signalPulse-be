server:
  port: 9090
  servlet:
    context-path: /

spring:
  application:
    name: signal-pulse
  datasource:
    url: jdbc:mysql://localhost:3306/signalPulse?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootroot}
  sql:
    init:
      mode: always
      data-locations: classpath:dataInitialize.sql
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  file:
    name: signalPulse.log
  level:
    com.signalpulse: DEBUG
    org.springframework.web: INFO
